[project]
name = "moiraweave-cli"
version = "0.3.3"
description = "MoiraWeave developer CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1",
    "httpx>=0.28",
    "kubernetes>=30.1",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "questionary>=2.1",
    "rich>=13.9",
    "typer>=0.12",
]

[project.scripts]
moira = "moira_cli.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "types-pyyaml>=6.0.12.20260510",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end CLI workflow tests (deselect with -m 'not integration')",
]
