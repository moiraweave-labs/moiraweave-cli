name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.13"

jobs:
  lint-test:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit Ruff lint
        run: uv run pre-commit run ruff --all-files --show-diff-on-failure

      - name: Pre-commit Ruff format
        run: uv run pre-commit run ruff-format --all-files --show-diff-on-failure

      - name: Ruff lint
        run: uv run ruff check moira_cli tests

      - name: Ruff format check
        run: uv run ruff format --check moira_cli tests

      - name: Mypy typecheck
        run: uv run mypy moira_cli/

      - name: Pytest
        run: uv run pytest

      - name: Build package
        run: uv build

  local-onboarding-e2e:
    name: Local onboarding E2E
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run moira up demo-agent smoke
        env:
          MOIRAWEAVE_LOCAL_E2E: "1"
        run: uv run pytest tests/test_local_e2e.py -q
